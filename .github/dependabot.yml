version: 2

updates:
  # Dart/Flutter packages. This is the project's dependency-vulnerability signal,
  # since CodeQL has no Dart analyzer.
  - package-ecosystem: 'pub'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      dart-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5

  - package-ecosystem: 'gradle'
    directory: '/android'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
